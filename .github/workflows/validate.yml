name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m py_compile custom_components/inim_smartlan/*.py
      - run: python tests/test_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/inim_smartlan/frontend/inim-smartlan-dashboard.js
      - run: node tests/dashboard_strategy.test.js
